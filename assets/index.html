<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src https: wss: http://localhost:* ws://localhost:*; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data: https:;">
<title>SeatLayer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #seatlayer-root {
    position: absolute;
    inset: 0;
    touch-action: none;
  }
</style>
<script>
/*__SEATLAYER_BUNDLE__*/
</script>
</head>
<body>
<div id="seatlayer-root"></div>
<script>
  (function () {
    if (!window.seatlayer || typeof window.seatlayer.startBridge !== 'function') {
      return;
    }
    window.__slHandle = window.seatlayer.startBridge({
      container: document.getElementById('seatlayer-root')
    });
  })();
</script>
</body>
</html>
